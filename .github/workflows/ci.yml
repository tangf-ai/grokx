name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  product-crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check product crates
        run: cargo check -p domain -p app-config -p agent-process -p acp-bridge -p permissions -p session-store -p app-core
      - name: Test libraries
        run: cargo test -p domain -p app-config -p agent-process -p acp-bridge -p permissions -p session-store

  desktop-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APP_VERSION="$(node -e 'const fs = require("node:fs"); const config = JSON.parse(fs.readFileSync("apps/desktop/src-tauri/tauri.conf.json", "utf8")); process.stdout.write(config.version)')"
          if [[ "$GITHUB_REF_NAME" != "v$APP_VERSION" ]]; then
            echo "error: tag $GITHUB_REF_NAME does not match app version $APP_VERSION" >&2
            exit 1
          fi
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
          cargo install dotslash --locked
      - name: Build bundled runtime
        run: |
          ./tools/build-engine.sh
          ./packaging/bundle_runtime.sh
          cargo clean --manifest-path engine/grok-build/Cargo.toml
      - name: Build Debian package
        working-directory: apps/desktop
        run: pnpm build:deb
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: grokx-deb-${{ github.sha }}
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [product-crates, desktop-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: grokx-deb-${{ github.sha }}
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/*.deb --clobber --repo "$GH_REPO"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/*.deb --verify-tag --generate-notes --title "Grokx $GITHUB_REF_NAME" --repo "$GH_REPO"
          fi
